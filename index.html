<title>Lock-in Tracker</title>
<style>
:root{
  --green:#34c759;--green-light:#e8f8ed;--blue:#007aff;--blue-light:#e5f1ff;
  --orange:#ff9500;--red:#ff3b30;--gold:#b8860b;--gold-bg:#fff8d6;--acc:#1a1a1a;
  --bg:#fff;--bg2:#f5f5f7;--bg3:#ebebed;
  --text:#1a1a1a;--text2:#6e6e73;
  --border:rgba(0,0,0,0.10);--border2:rgba(0,0,0,0.18);
  --f:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;--text:#f2f2f7;--text2:#aeaeb2;
  --border:rgba(255,255,255,0.10);--border2:rgba(255,255,255,0.18);
  --green-light:#0d2e18;--blue-light:#0a1f3e;--gold:#e6b800;--gold-bg:#2a2200;
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:var(--f);background:var(--bg);color:var(--text);height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;}

/* ── Header ── */
.hdr{padding:.75rem 1rem .6rem;border-bottom:.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.ttl{font-size:18px;font-weight:700;letter-spacing:-.4px;}
.sub{font-size:11px;color:var(--text2);margin-top:1px;}
.sync{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
.dot.off{background:var(--text2);}.dot.spin{background:var(--orange);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── Tabs ── */
.tabs{display:flex;border-bottom:.5px solid var(--border);flex-shrink:0;}
.tab{flex:1;padding:9px 4px;text-align:center;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;}
.tab.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600;}
@media(prefers-color-scheme:dark){.tab.on{color:#f2f2f7;border-bottom-color:#f2f2f7;}}

/* ── Pages ── */
.page{display:none;flex:1;flex-direction:column;overflow:hidden;min-height:0;}
.page.on{display:flex;}

/* ══════════════════════════════════
   TAB 1 — LEADERBOARD
══════════════════════════════════ */
.lb-top{flex-shrink:0;padding:8px 1rem;border-bottom:.5px solid var(--border);}
.badges{display:flex;gap:5px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
.bdg{font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;}
.bdg.on{background:var(--gold-bg);color:var(--gold);border:.5px solid var(--gold);}
.bdg.off{background:var(--bg2);border:.5px solid var(--border);color:var(--text2);}

/* Horizontal scroll grid: rows=dates, cols=persons sorted by rank */
.lb-wrap{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0;}
.lb-scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;}

/* Grid: first col = date label (sticky left), rest = person columns */
.lb-grid{display:grid;min-width:max-content;}
/* sticky col header row */
.lb-col-hdr{display:contents;}
.lch{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:.5px solid var(--border2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7px 4px;gap:2px;min-width:52px;}
.lch.date-ch{position:sticky;top:0;left:0;z-index:20;min-width:52px;border-right:.5px solid var(--border);}
.lch-rank{font-size:9px;color:var(--text2);font-weight:500;}
.lch-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
.lch-name{font-size:10px;font-weight:600;color:var(--text);}
.lch-cnt{font-size:9px;color:var(--text2);}

/* Month separator */
.lb-month{min-width:52px;background:var(--bg2);padding:3px 6px;font-size:9px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--text2);border-bottom:.5px solid var(--border);}
.lb-month.date-col{position:sticky;left:0;z-index:6;border-right:.5px solid var(--border);}

/* Date label cell */
.lb-date{position:sticky;left:0;z-index:5;background:var(--bg);min-width:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px 2px;border-right:.5px solid var(--border);border-bottom:.5px solid var(--border);min-height:46px;}
.lb-date .dd{font-size:9px;color:var(--text2);font-weight:500;}
.lb-date .dn{font-size:12px;font-weight:600;color:var(--text);}
.lb-date.we .dd,.lb-date.we .dn{opacity:.45;}
.lb-date.td .dn{color:var(--blue);font-weight:700;}

/* Workout cell */
.lb-cell{min-width:38px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px 1px;border-right:.5px solid var(--border);border-bottom:.5px solid var(--border);min-height:46px;}
.lb-cell.we{background:var(--bg2);}
.lb-cell.td{background:var(--blue-light);}
.lb-cell.hw{background:var(--green-light);}


/* ══════════════════════════════════
   TAB 2 — COMPETITION
══════════════════════════════════ */
.comp-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:1rem;display:flex;flex-direction:column;gap:1rem;}
.comp-section{background:var(--bg2);border-radius:14px;overflow:hidden;}
.comp-section-hdr{padding:10px 14px;border-bottom:.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.comp-section-title{font-size:13px;font-weight:700;color:var(--text);}
.comp-section-sub{font-size:11px;color:var(--text2);}
.comp-winner-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:.5px solid var(--border);}
.comp-winner-row:last-child{border-bottom:none;}
.comp-trophy{font-size:18px;width:28px;text-align:center;flex-shrink:0;}
.comp-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.comp-info{flex:1;min-width:0;}
.comp-name{font-size:13px;font-weight:600;color:var(--text);}
.comp-detail{font-size:11px;color:var(--text2);margin-top:1px;}
.comp-score{font-size:16px;font-weight:700;text-align:right;flex-shrink:0;}
.comp-divider{height:.5px;background:var(--border);margin:0 14px;}
.comp-all-row{display:flex;align-items:center;gap:8px;padding:7px 14px;border-bottom:.5px solid var(--border);}
.comp-all-row:last-child{border-bottom:none;}
.comp-rank{font-size:11px;color:var(--text2);width:18px;flex-shrink:0;font-weight:600;}
.comp-bar-wrap{flex:1;background:var(--bg3);border-radius:4px;height:6px;overflow:hidden;}
.comp-bar{height:100%;border-radius:4px;transition:width .3s;}
.comp-val{font-size:11px;font-weight:600;color:var(--text);min-width:28px;text-align:right;}

/* ══════════════════════════════════
   TAB 2 — LOG
══════════════════════════════════ */
.log-pick{flex-shrink:0;padding:.75rem 1rem;border-bottom:.5px solid var(--border);}
.log-pick-lbl{font-size:11px;color:var(--text2);margin-bottom:8px;font-weight:500;}
.person-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;}
.pg-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:12px;border:.5px solid var(--border2);background:none;cursor:pointer;font-family:var(--f);transition:all .12s;width:100%;}
.pg-btn.on{border-color:transparent;}
.pg-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
.pg-name{font-size:10px;font-weight:500;color:var(--text);width:100%;text-align:center;word-break:break-word;white-space:normal;line-height:1.2;padding:0 1px;}
.pg-cnt{font-size:9px;color:var(--text2);}

/* Log grid — single person column */
.log-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;}
.log-grid{display:grid;grid-template-columns:52px 1fr;width:100%;}

.log-ch{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:.5px solid var(--border2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;gap:3px;}
.log-ch.date-ch{border-right:.5px solid var(--border);}
.log-ch-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;}
.log-ch-name{font-size:11px;font-weight:600;color:var(--text);}
.log-ch-cnt{font-size:10px;color:var(--text2);}

.log-month{background:var(--bg2);padding:4px 8px;font-size:9px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--text2);border-bottom:.5px solid var(--border);}
.log-month.date-col{position:sticky;left:0;z-index:6;border-right:.5px solid var(--border);}

.log-date{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px 2px;border-right:.5px solid var(--border);border-bottom:.5px solid var(--border);min-height:40px;}
.log-date .dd{font-size:9px;color:var(--text2);font-weight:500;}
.log-date .dn{font-size:13px;font-weight:600;color:var(--text);}
.log-date.we .dd,.log-date.we .dn{opacity:.45;}
.log-date.td .dn{color:var(--blue);font-weight:700;}

.log-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:3px;border-bottom:.5px solid var(--border);min-height:40px;cursor:pointer;transition:background .1s;}
.log-cell:active{opacity:.7;}
.log-cell.we{background:var(--bg2);}
.log-cell.td{background:var(--blue-light);}
.log-cell.hw{background:var(--green-light);}

/* Shared cell content */
.ck{width:19px;height:19px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;}
.ck svg{width:10px;height:10px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.rpe-d{width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:#fff;}
.cat-i{font-size:10px;line-height:1;}
.multi{font-size:8px;font-weight:700;color:var(--green);background:var(--bg);border:1px solid var(--green);border-radius:5px;padding:1px 3px;line-height:1.3;}

/* ── Modal ── */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-end;justify-content:center;}
.ov.open{display:flex;}
.sheet{background:var(--bg);border-radius:20px 20px 0 0;padding:1.1rem 1.1rem calc(2.5rem + env(safe-area-inset-bottom));width:100%;max-width:480px;max-height:88vh;overflow-y:auto;}
.drag{width:34px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto .9rem;}
.mt{font-size:15px;font-weight:600;margin-bottom:2px;color:var(--text);}
.msub{font-size:12px;color:var(--text2);margin-bottom:.9rem;}
.wl{display:flex;flex-direction:column;gap:5px;margin-bottom:.75rem;}
.wr{display:flex;align-items:center;gap:7px;background:var(--bg2);border-radius:9px;padding:7px 9px;}
.wp{font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px;flex-shrink:0;}
.wp.gym{background:#eef;color:#446;}.wp.run{background:#efe;color:#363;}.wp.other{background:#fef;color:#636;}
@media(prefers-color-scheme:dark){.wp.gym{background:#1a1a3a;color:#99b;}.wp.run{background:#0d2a0d;color:#7b7;}.wp.other{background:#2a1a2a;color:#b8b;}}
.wrpe{font-size:12px;font-weight:600;flex:1;}
.wdel{background:none;border:none;cursor:pointer;color:var(--text2);font-size:18px;padding:0 3px;line-height:1;font-family:var(--f);}
.empty{font-size:13px;color:var(--text2);text-align:center;padding:.75rem 0;}
.divl{height:.5px;background:var(--border);margin:.7rem 0;}
.fl{font-size:11px;font-weight:500;color:var(--text2);display:block;margin-bottom:6px;}
.cp{display:flex;gap:5px;margin-bottom:.75rem;}
.cb{flex:1;padding:8px 3px;border-radius:9px;border:1.5px solid var(--border2);background:none;cursor:pointer;font-size:11px;font-weight:600;color:var(--text2);font-family:var(--f);transition:all .1s;display:flex;flex-direction:column;align-items:center;gap:2px;}
.cb .ce{font-size:18px;}
.cb.sgym{border-color:#446;background:#eef;color:#446;}.cb.srun{border-color:#363;background:#efe;color:#363;}.cb.sother{border-color:#636;background:#fef;color:#636;}
@media(prefers-color-scheme:dark){.cb.sgym{background:#1a1a3a;color:#99b;border-color:#99b;}.cb.srun{background:#0d2a0d;color:#7b7;border-color:#7b7;}.cb.sother{background:#2a1a2a;color:#b8b;border-color:#b8b;}}
.rp{display:flex;gap:5px;margin-bottom:.75rem;flex-wrap:wrap;}
.rb{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--border2);background:none;cursor:pointer;font-size:12px;font-weight:600;color:var(--text);font-family:var(--f);}
.rb.sel{color:#fff;border-color:transparent;}
.ma{display:flex;gap:7px;}
.bprim{flex:1;padding:12px;border-radius:11px;background:var(--acc);color:#fff;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--f);}
.bsec{padding:12px 14px;border-radius:11px;background:var(--bg2);color:var(--text2);border:.5px solid var(--border);font-size:14px;cursor:pointer;font-family:var(--f);}
@media(prefers-color-scheme:dark){.bprim{background:#f2f2f7;color:#1a1a1a;}}
</style>
</head>
<body>

<div class="hdr">
  <div><div class="ttl">Lock-in Tracker</div><div class="sub">June – August 2026</div></div>
  <div class="sync"><div class="dot off" id="dot"></div><span id="synclbl">Connecting...</span></div>
</div>

<div class="tabs">
  <div class="tab on" onclick="switchTab(0)">🏆 Leaderboard</div>
  <div class="tab" onclick="switchTab(1)">🥊 Competition</div>
  <div class="tab" onclick="switchTab(2)">📝 Log workout</div>
</div>

<!-- TAB 1: LEADERBOARD -->
<div class="page on" id="page-lb">
  <div class="lb-wrap">
    <div class="lb-scroll">
      <div class="lb-grid" id="lb-grid"></div>
    </div>
  </div>
</div>


<!-- TAB 2: COMPETITION -->
<div class="page" id="page-comp">
  <div class="comp-wrap" id="comp-wrap"></div>
</div>

<!-- TAB 3: LOG -->
<div class="page" id="page-log">
  <div class="log-pick">
    <div class="log-pick-lbl">Who are you?</div>
    <div class="person-grid" id="person-grid"></div>
  </div>
  <div class="log-wrap">
    <div class="log-grid" id="log-grid"></div>
  </div>
</div>

<!-- MODAL -->
<div class="ov" id="ov" onclick="bgClick(event)">
  <div class="sheet">
    <div class="drag"></div>
    <div class="mt" id="mt"></div>
    <div class="msub" id="msub"></div>
    <div class="wl" id="wl"></div>
    <div class="divl"></div>
    <span class="fl">Category</span>
    <div class="cp">
      <button class="cb" id="cb-gym"   onclick="selCat('gym')"  ><span class="ce">🏋️</span>Gym</button>
      <button class="cb" id="cb-run"   onclick="selCat('run')"  ><span class="ce">🏃</span>Run</button>
      <button class="cb" id="cb-other" onclick="selCat('other')"><span class="ce">⚡</span>Other</button>
    </div>
    <span class="fl">RPE 1–10 (optional)</span>
    <div class="rp" id="rp"></div>
    <div class="ma">
      <button class="bsec" onclick="closeMod()">Done</button>
      <button class="bprim" onclick="addW()">+ Add workout</button>
    </div>
  </div>
</div>

<script>
// ============================================================

function dbk(pi,k){return pi+'_'+k;}
function gw(pi,k){return db[dbk(pi,k)]||[];}
function dim(y,m){return new Date(y,m+1,0).getDate();}
function dow(y,m,d){return (new Date(y,m,d).getDay()+6)%7;} // 0=Mon,6=Sun
function ds(y,m,d){return y+'-'+m+'-'+d;}
function rc(v){return !v?'#888':v<=3?'#34c759':v<=5?'#007aff':v<=7?'#ff9500':'#ff3b30';}
function cnt(pi){return Object.entries(db).filter(([k])=>k.startsWith(pi+'_')).reduce((n,[,a])=>n+a.length,0);}
function catCnt(pi,cat){return Object.entries(db).filter(([k])=>k.startsWith(pi+'_')).reduce((t,[,a])=>t+a.filter(w=>w.cat===cat).length,0);}

// ── Supabase ──
async function sbF(path,opts={}){
  return fetch(SUPABASE_URL+path,{...opts,headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=representation',...(opts.headers||{})}});
}
async function loadAll(){
  setSS('spin');
  try{
    const res=await sbF('/rest/v1/workouts?select=*');
    if(!res.ok)throw new Error();
    const rows=await res.json();
    db={};
    rows.forEach(r=>{const k=dbk(r.person_index,r.day_key);if(!db[k])db[k]=[];db[k].push({id:r.id,rpe:r.rpe,cat:r.category});});
    setSS('on');
  }catch(e){setSS('off');}
  render();
}
async function insertW(pi,key,rpe,cat){
  setSS('spin');
  try{
    const res=await sbF('/rest/v1/workouts',{method:'POST',body:JSON.stringify({person_index:pi,day_key:key,rpe,category:cat})});
    if(!res.ok)throw new Error();
    const rows=await res.json();
    const k=dbk(pi,key);if(!db[k])db[k]=[];
    db[k].push({id:rows[0].id,rpe:rows[0].rpe,cat:rows[0].category});
    setSS('on');
  }catch(e){setSS('off');}
  render();if(MD&&MD.pi===pi&&MD.key===key)refreshList();
}
async function deleteW(id,pi,key){
  setSS('spin');
  try{
    const res=await sbF('/rest/v1/workouts?id=eq.'+id,{method:'DELETE',headers:{'Prefer':'return=minimal'}});
    if(!res.ok)throw new Error();
    const k=dbk(pi,key);db[k]=(db[k]||[]).filter(w=>w.id!==id);if(!db[k].length)delete db[k];
    setSS('on');
  }catch(e){setSS('off');}
  render();if(MD&&MD.pi===pi&&MD.key===key)refreshList();
}
setInterval(loadAll,30000);
function setSS(s){
  document.getElementById('dot').className='dot '+(s==='on'?'':s==='spin'?'spin':'off');

// ── Tabs ──
function switchTab(t){

}

// ── Cell HTML ──
function cellHTML(ws){
  if(!ws.length)return'';
  const ck='<div class="ck"><svg viewBox="0 0 14 14"><polyline points="2,7 6,11 12,3"/></svg></div>';
  if(ws.length>1){
    const cats=[...new Set(ws.map(w=>w.cat).filter(Boolean))];
    return ck+'<div class="multi">'+cats.slice(0,2).map(c=>CE[c]||'⚡').join('')+'×'+ws.length+'</div>';
  }
  const w=ws[0];
  return ck+(w.rpe?'<div class="rpe-d" style="background:'+rc(w.rpe)+'">'+w.rpe+'</div>':'')+(w.cat?'<div class="cat-i">'+CE[w.cat]+'</div>':'');
}

// ── Leaderboard ──
const BADGES=[
  {e:'🥇',l:'10 sessions',  c:(cc,pi)=>cc[pi]>=10},
  {e:'🏆',l:'First to 20!', c:(cc,pi)=>cc[pi]>=20&&cc.every((v,i)=>i===pi||cc[pi]>=v)},
  {e:'💪',l:'Double day',   c:(cc,pi)=>Object.entries(db).filter(([k])=>k.startsWith(pi+'_')).some(([,a])=>a.length>=2)},
  {e:'🔥',l:'7-day streak', c:(cc,pi)=>checkStreak(pi,7)},
];
function checkStreak(pi,n){
  let streak=0,max=0,d=new Date(2026,5,1),end=new Date(2026,8,0);
  while(d<=end){if(gw(pi,ds(d.getFullYear(),d.getMonth(),d.getDate())).length>0){streak++;max=Math.max(max,streak);}else streak=0;d.setDate(d.getDate()+1);}
  return max>=n;
}
function renderBadges(){
  const cc=PERSONS.map((_,i)=>cnt(i));
  // show badges for current user (CU) on lb tab, just show all earned across squad
  const earned=new Set();
  PERSONS.forEach((_,pi)=>{BADGES.forEach(b=>{if(b.c(cc,pi))earned.add(b.e+' '+b.l+' ('+PERSONS[pi].name+')');});});
  document.getElementById('badges').innerHTML=[...earned].map(l=>'<div class="bdg on">'+l+'</div>').join('')||'<div class="bdg off">No badges yet — get training!</div>';
}

    allDays.forEach(({y,m,d,w,key})=>{
      const ws=gw(p.pi,key);const isWe=w===5||w===6;const isTd=key===TS;
      h+='<div class="lb-cell'+(ws.length?' hw':isTd?' td':isWe?' we':'')+'">'+cellHTML(ws)+'</div>';
    });
  });

  el.innerHTML=h;
}

// ── Competition ──
function getMonthStats(pi, y, m) {
  let workouts = 0, rpe = 0;
  for (let d = 1; d <= dim(y, m); d++) {
    const ws = gw(pi, ds(y, m, d));
    workouts += ws.length;
    rpe += ws.reduce((s, w) => s + (w.rpe || 0), 0);
  }
  return { workouts, rpe };
}

  // ── Overall totals ──

    return { ...p, pi, ws_count, rpe_sum };

  const maxRpe = Math.max(...overall.map(p => p.rpe_sum), 1);

  const byRpe = [...overall].sort((a, b) => b.rpe_sum - a.rpe_sum);

  // Overall workouts
  h += '<div class="comp-section">';
  h += '<div class="comp-section-hdr"><div class="comp-section-title">💪 Total Workouts</div><div class="comp-section-sub">All time</div></div>';
  // top 3 winners
  const wTrophies = ['🥇','🥈','🥉'];
  byWs.slice(0, 3).forEach((p, i) => {
    h += '<div class="comp-winner-row">'
      + '<div class="comp-trophy">' + wTrophies[i] + '</div>'
      + '<div class="comp-av" style="background:' + p.bg + ';color:' + p.color + '">' + p.l + '</div>'
      + '<div class="comp-info"><div class="comp-name">' + p.name + '</div></div>'
      + '<div class="comp-score" style="color:' + p.color + '">' + p.ws_count + '</div>'
      + '</div>';
  });
  h += '<div class="comp-divider"></div>';
  byWs.forEach((p, i) => {
    const pct = Math.round(p.ws_count / maxWs * 100);
    h += '<div class="comp-all-row">'
      + '<div class="comp-rank">' + (i + 1) + '</div>'
      + '<div class="comp-av" style="background:' + p.bg + ';color:' + p.color + ';width:22px;height:22px;font-size:9px;">' + p.l + '</div>'
      + '<div style="font-size:11px;font-weight:500;color:var(--text);width:64px;flex-shrink:0;">' + p.name + '</div>'
      + '<div class="comp-bar-wrap"><div class="comp-bar" style="width:' + pct + '%;background:' + p.color + '"></div></div>'
      + '<div class="comp-val">' + p.ws_count + '</div>'
      + '</div>';
  });
  h += '</div>';

  // Overall RPE
  h += '<div class="comp-section">';
  h += '<div class="comp-section-hdr"><div class="comp-section-title">⚡ Total RPE</div><div class="comp-section-sub">Sum of all logged RPE</div></div>';
  byRpe.slice(0, 3).forEach((p, i) => {
    h += '<div class="comp-winner-row">'
      + '<div class="comp-trophy">' + wTrophies[i] + '</div>'
      + '<div class="comp-av" style="background:' + p.bg + ';color:' + p.color + '">' + p.l + '</div>'
      + '<div class="comp-info"><div class="comp-name">' + p.name + '</div></div>'
      + '<div class="comp-score" style="color:' + p.color + '">' + p.rpe_sum + '</div>'
      + '</div>';
  });
  h += '<div class="comp-divider"></div>';
  byRpe.forEach((p, i) => {
    const pct = Math.round(p.rpe_sum / maxRpe * 100);
    h += '<div class="comp-all-row">'
      + '<div class="comp-rank">' + (i + 1) + '</div>'
      + '<div class="comp-av" style="background:' + p.bg + ';color:' + p.color + ';width:22px;height:22px;font-size:9px;">' + p.l + '</div>'
      + '<div style="font-size:11px;font-weight:500;color:var(--text);width:64px;flex-shrink:0;">' + p.name + '</div>'
      + '<div class="comp-bar-wrap"><div class="comp-bar" style="width:' + pct + '%;background:' + p.color + '"></div></div>'
      + '<div class="comp-val">' + p.rpe_sum + '</div>'
      + '</div>';
  });
  h += '</div>';

  // ── Per month ──
  MONTHS.forEach(({ y, m, n }) => {
    const monthStats = PERSONS.map((p, pi) => ({ ...p, pi, ...getMonthStats(pi, y, m) }));
    const mByWs  = [...monthStats].sort((a, b) => b.workouts - a.workouts);
    const mByRpe = [...monthStats].sort((a, b) => b.rpe - a.rpe);
    const mMaxWs  = Math.max(...monthStats.map(p => p.workouts), 1);
    const mMaxRpe = Math.max(...monthStats.map(p => p.rpe), 1);

    h += '<div class="comp-section">';
    h += '<div class="comp-section-hdr"><div class="comp-section-title">📅 ' + n + '</div></div>';
    h += '<div style="display:flex;">';

    // Left — workouts
    h += '<div style="flex:1;min-width:0;border-right:.5px solid var(--border);">';

      + '<div style="font-size:13px;font-weight:700;color:' + mByWs[0].color + ';flex-shrink:0;">' + mByWs[0].workouts + '</div>'
      + '</div>';
    mByWs.forEach((p, i) => {

      h += '<div style="display:flex;align-items:center;gap:4px;padding:4px 8px;border-bottom:.5px solid var(--border);">'

        + '<div style="font-size:9px;font-weight:600;color:var(--text);min-width:16px;text-align:right;flex-shrink:0;">' + p.workouts + '</div>'
        + '</div>';

    h += '</div>';

    // Right — RPE
    h += '<div style="flex:1;min-width:0;">';

    h += '<div style="padding:6px 8px;display:flex;align-items:center;gap:5px;border-bottom:.5px solid var(--border);">'
      + '<div style="font-size:13px;">🥇</div>'
      + '<div style="width:20px;height:20px;border-radius:50%;background:' + mByRpe[0].bg + ';color:' + mByRpe[0].color + ';display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;flex-shrink:0;">' + mByRpe[0].l + '</div>'
      + '<div style="font-size:11px;font-weight:600;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + mByRpe[0].name + '</div>'
      + '<div style="font-size:13px;font-weight:700;color:' + mByRpe[0].color + ';flex-shrink:0;">' + mByRpe[0].rpe + '</div>'
      + '</div>';
    mByRpe.forEach((p, i) => {
      const pct = Math.round(p.rpe / mMaxRpe * 100);
      h += '<div style="display:flex;align-items:center;gap:4px;padding:4px 8px;border-bottom:.5px solid var(--border);">'
        + '<div style="font-size:9px;color:var(--text2);width:12px;flex-shrink:0;">' + (i+1) + '</div>'
        + '<div style="font-size:9px;font-weight:500;color:var(--text);width:44px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;">' + p.name + '</div>'
        + '<div style="flex:1;background:var(--bg3);border-radius:3px;height:4px;overflow:hidden;">'
        + '<div style="width:' + pct + '%;height:100%;background:' + p.color + ';border-radius:3px;"></div></div>'
        + '<div style="font-size:9px;font-weight:600;color:var(--text);min-width:16px;text-align:right;flex-shrink:0;">' + p.rpe + '</div>'

    h += '</div>';

    h += '</div>'; // end side-by-side
    h += '</div>'; // end section
  });

  el.innerHTML = h;

  renderLeaderboard();
  renderComp();
  renderPersonGrid();

// ── Modal ──
function openMod(pi,key){
  MD={pi,key};SRPE=null;SCAT=null;
  const pts=key.split('-');const dt=new Date(+pts[0],+pts[1],+pts[2]);
  document.getElementById('mt').textContent=PERSONS[pi].name+"'s workouts";
  document.getElementById('msub').textContent=dt.toLocaleDateString('en-SE',{weekday:'long',month:'long',day:'numeric'});
  resetCats();buildRpe();refreshList();
  document.getElementById('ov').classList.add('open');
}
function refreshList(){
  if(!MD)return;const ws=gw(MD.pi,MD.key);const el=document.getElementById('wl');
  if(!ws.length){el.innerHTML='<div class="empty">No workouts logged yet</div>';return;}
  el.innerHTML=ws.map(w=>{const cc=w.cat||'other';return '<div class="wr"><span class="wp '+cc+'">'+CE[cc]+' '+CL[cc]+'</span><div class="wrpe" style="color:'+rc(w.rpe)+'">'+(w.rpe?'RPE '+w.rpe:'No RPE')+'</div><button class="wdel" onclick="deleteW('+w.id+','+MD.pi+',\''+MD.key+'\')">×</button></div>';}).join('');
}
function selCat(c){SCAT=c;['gym','run','other'].forEach(x=>{document.getElementById('cb-'+x).className='cb'+(x===c?' s'+x:'');});}
function resetCats(){SCAT=null;['gym','run','other'].forEach(x=>{document.getElementById('cb-'+x).className='cb';});}
function buildRpe(){
  SRPE=null;const rp=document.getElementById('rp');rp.innerHTML='';
  for(let i=1;i<=10;i++){const b=document.createElement('button');b.className='rb';b.textContent=i;b.onclick=()=>{SRPE=i;rp.querySelectorAll('.rb').forEach((btn,j)=>{const v=j+1;btn.classList.toggle('sel',v===i);btn.style.background=v===i?rc(v):'';});};rp.appendChild(b);}
}
function addW(){if(!MD)return;insertW(MD.pi,MD.key,SRPE,SCAT);resetCats();buildRpe();}
function closeMod(){document.getElementById('ov').classList.remove('open');}
function bgClick(e){if(e.target===document.getElementById('ov'))closeMod();}

loadAll();
</script>
</body>
</html>
